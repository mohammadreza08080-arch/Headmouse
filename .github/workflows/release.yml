name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller headmouse.spec
      - run: bash packaging/build_deb.sh ${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: "*.deb" }

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller headmouse.spec
      - run: Compress-Archive -Path dist/HeadMouse/* -DestinationPath HeadMouse-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: HeadMouse-Windows.zip }

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true